<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión — DentalDesk</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0a1e3d;
      color: #cbd5e1;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .caja {
      max-width: 380px;
      text-align: center;
    }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 24px; }
    h1 { color: #fff; font-size: 22px; margin: 0 0 10px; }
    p { font-size: 15px; line-height: 1.6; margin: 0 0 26px; }
    button {
      background: #fff;
      color: #0a1e3d;
      border: none;
      padding: 13px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .nota { font-size: 13px; color: #64748b; margin-top: 22px; }
  </style>
</head>
<body>
  <div class="caja">
    <img src="/icons/icon-192.png" alt="DentalDesk" />
    <h1>Sin conexión</h1>
    <p>
      No pudimos conectarnos al servidor. Revisá tu conexión a internet
      y volvé a intentar.
    </p>
    <button onclick="location.reload()">Reintentar</button>
    <div class="nota">
      Los datos de tus pacientes están a salvo en el servidor: no se guarda nada
      en este dispositivo.
    </div>
  </div>
</body>
</html>
